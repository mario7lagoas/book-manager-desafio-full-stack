server:
  servlet:
    context-path: /book-api/v1
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  servlet.multipart.enabled: true
  datasource:
    url: jdbc:mysql://mysql:3306/bookdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Pool configuration
      maximum-pool-size: 20          # Aumentado de 10
      minimum-idle: 5                     # Reduzido para economizar recursos
      idle-timeout: 300000            # 5 minutos
      max-lifetime: 1200000           # 20 minutos
      connection-timeout: 20000 # 20 segundos
      # Performance
      leak-detection-threshold: 60000 # 60 segundos
      validation-timeout: 5000
      login-timeout: 5
      # Connection testing
      connection-test-query: SELECT 1
  jackson:
    date-format: yyyy-MM-dd
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: 
  expiration: 120000
  refreshToken: 3600000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
